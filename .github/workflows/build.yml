name: Build JARVIS APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jarvis.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: proj/jarvis-android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: proj/jarvis-android/app/build/outputs/apk/debug/*.apk
